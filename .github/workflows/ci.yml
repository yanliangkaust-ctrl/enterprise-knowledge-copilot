name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-release-dev.txt && python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Run deterministic RAG evaluation gate
        if: always()
        run: python -m backend.evaluation_runner --check --output data/evaluation/phase2_report.json

      - name: Upload RAG evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: data/evaluation/phase2_report.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend release checks
        run: npm ci --prefix frontend && npm test --prefix frontend && npm run build --prefix frontend

      - name: Build Docker image
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} --tag enterprise-knowledge-copilot-api:${{ github.sha }} .

      - name: Validate exact container release
        run: python scripts/validate_container.py --image enterprise-knowledge-copilot-api:${{ github.sha }}

      - name: Upload container validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-validation-${{ github.sha }}
          path: artifacts/container-validation/
